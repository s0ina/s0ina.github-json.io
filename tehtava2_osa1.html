<!DOCTYPE html>
<html lang="en">

<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <main id="main" class="container">
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Etusivu (Tehtävä 1 OSA I)</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="tehtava1_osa2.html">Tehtävä 1 OSA II</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="tehtava2_osa1.html">Tehtävä 2 OSA I</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="tehtava2_osa2.html">Tehtävä 2 OSA II</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="tehtava3.html">Tehtävä 3</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </main>
    <script>
        //Globaali muuttuja JSON-kuvalle
        let currentPokemonData;
        function poke() {
            //Tallennetaan annettu Poken nimi muuttujaan pokeName, muuttetaan se samalla pieniksi kirjaimiksi
            const pokeName = document.getElementById("pokemonName").value.toLowerCase();
            //Tallennetaan myös nimi talteen muuttujaan name
            const name = document.getElementById("pokemonName").value;
            fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)

                // Muunnetaan vastaus JSON-muotoon  
                .then(function (response) {
                    return response.json();
                })
                //Käsitellään muunnettu (eli JSON muotoinen) vastaus 
                // Kutsutaan funktiota kerro()ja välitetään sille json-vastaus
                .then(function (responseJson) {
                   pokekuva(responseJson);
                   //Tallennetaan vastaus muuttujaan
                   currentPokemonData = responseJson;
                })
                // Jos tuli jokin virhe 
                .catch(function (error) {
                    document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
                })
        }

        function pokekuva(obj) {
            //Tallennetaan muuttujan linkki josta löytty Poken kuva    
            let pokeurl = obj.sprites.front_default;
            //Kirjoitetaan kuva, ja nimi sivulla sekä tyhyjennetään hakukenttä    
            document.getElementById("kuva2").innerHTML = "<img src=" + pokeurl + ">";
            document.getElementById("nimi").innerHTML = "<b>" + name + "</b>";
            document.getElementById("pokemonName").value = "";
        }
        //Funktio kuvan kääntämiselle
        function poke2(obj) {
            //Annetaan globaalille muuttujalle uusi arvo
            let pokeurl2 = currentPokemonData.sprites.back_default;
            document.getElementById("kuva2").innerHTML = "<img src=" + pokeurl2 + ">";
        }
    </script>
    <br>
    <div class="center" id="vastaus">
        <h1>Pokemon haku</h1>
        <p>
            <input type="text" id="pokemonName" placeholder="Enter Pokemon name">
            <button onclick="poke()">Hae</button><br>
        <div id="nimi">Hae Pokemon</div>
        <p id="kuva2"></p>
        <button onclick="poke2(currentPokemonData)">Käännä</button><br>
        </p>
    </div>
</body>

</html>
