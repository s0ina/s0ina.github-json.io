    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <main id="main" class="container">
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Etusivu (Tehtävä 1 OSA I)</a>

                        <li class="nav-item">
                            <a class="nav-link" href="tehtava1_osa2.html">Tehtävä 1 OSA II</a>

                        <li class="nav-item">
                            <a class="nav-link" href="tehtava2_osa1.html">Tehtävä 2 OSA I</a>

                        <li class="nav-item">

                        <li class="nav-item">

                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container" id="vastaus">
            <h1>Sää Helsingissä</h1>
        </div>
    </main>
    <script>
        let data;
        fetch(`https://api.openweathermap.org/data/2.5/weather?id=658225&appid=665ecd56dfc08dbb50feb8b8f5034e28&lang=fi&units=metric
`)
        // Muunnetaan vastaus JSON muotoon
            .then(function (response) {
                return response.json();
            })
            //Käsitellään muunnettu (eli JSON muotoinen) vastaus
            .then(function (responseJson) {

            // Kutsutaan funktiota ja välitetään sille json-vastaus
            nayta(responseJson);
            data = responseJson;
            //console.log(data)
            })
            // Jos tuli jokin virhe
            .catch(function (error) {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
            })

        function nayta(data) {
            let saa = "<p> Lämpötila: " + data.main.temp +"</p>"+"<br>"+
            "<p> Tuuli: " + data.wind.speed + "</p>"+"<br>" +
            "<p> Sää: " + data.weather.main + "</p>"+"<br>"+ "<p>" + data.weather.description + "</p>"+"<br>" + data.weather.icon + "</p>"+"<br>"


            document.getElementById("vastaus").innerHTML += saa;
        }
    </script>

</body>

</html>
